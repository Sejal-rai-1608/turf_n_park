name: turfandpark
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # UI & Animations
  animate_do: ^4.2.0
  bouncing_widget: ^2.0.0
  carousel_slider: ^5.0.0

  dotted_border: ^3.1.0
  fancy_shimmer_image: ^2.0.3
  lottie: ^3.3.2
  shimmer: ^3.0.0
  page_transition: ^2.1.0
  zoom_pinch_overlay: ^1.2.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_context: ^0.3.0
  get: ^4.6.6

  # Networking
  dio: ^5.4.0
  http: ^1.1.2

  # Firebase & Auth
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  flutter_facebook_auth: ^6.0.4
  google_sign_in: ^6.2.1

  # Location & Maps
  geolocator: ^14.0.2
  location: ^8.0.1

  # Forms & Inputs
  intl: ^0.20.2
  intl_phone_number_input: ^0.7.4
  pin_code_fields: ^8.0.1
  select_form_field: ^2.2.0
  multiselect: ^0.1.0

  # Payments
  razorpay_flutter: ^1.3.7
 
  # Utilities
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  drop_down_list: ^0.0.8
  custom_radio_grouped_button: ^2.2.0
  rounded_loading_button: ^2.1.0
  syncfusion_flutter_datepicker: ^32.1.24

  # Dev utility (safe here)
  change_app_package_name: ^1.1.0
  flutter_screenutil: ^5.9.3
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/appLogo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
